<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you | BFK</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500&family=Italiana&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#F2ECE5;color:#2F2B27;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.mark{font-family:Italiana,serif;font-size:36px;letter-spacing:.12em;color:#A8742F;margin-bottom:18px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:40px;margin-bottom:12px}
p{color:#6A6058;max-width:40ch;margin:0 auto;font-weight:300;line-height:1.55}
.wa{display:inline-block;margin-top:22px;min-height:52px;padding:14px 28px;border-radius:999px;background:#4E4038;color:#F2ECE5;text-decoration:none;font-weight:500;letter-spacing:.04em}
.wa:hover{opacity:.93}
.note{margin-top:16px;font-size:13px}
</style>
</head>
<body>
  <div>
    <div class="mark">bfk.</div>
    <h1>Received</h1>
    <p id="lead">Thank you — your details are with the BFK team. We’ll use them to prepare your day.</p>
    <a id="wa-btn" class="wa" href="https://wa.me/923018976552" hidden>Send details on WhatsApp</a>
    <p id="wa-note" class="note" hidden>If WhatsApp didn’t open, tap the button above. Your details are already saved.</p>
  </div>
  <script>
  (function(){
    var btn = document.getElementById('wa-btn');
    var note = document.getElementById('wa-note');
    var lead = document.getElementById('lead');
    var text = '';
    try { text = sessionStorage.getItem('bfkAfterBookingWa') || ''; } catch (e) { text = ''; }
    var url = 'https://wa.me/923018976552';
    if(text){
      url += '?text=' + encodeURIComponent(text);
      lead.textContent = 'Thank you — your details are saved. Next, send a copy to Faisal on WhatsApp.';
    }
    btn.href = url;
    btn.hidden = false;
    note.hidden = false;
    // Same-tab open is the most reliable after an async submit (popups are often blocked).
    window.setTimeout(function(){ window.location.href = url; }, 500);
  })();
  </script>
</body>
</html>
